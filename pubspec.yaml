name: fitnag
description: "FitNag - Your persistently motivating fitness companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^14.8.1
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^4.0.6
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  confetti: ^0.8.0
  cached_network_image: ^3.4.1
  table_calendar: ^3.1.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  custom_lint:
  riverpod_lint:

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
