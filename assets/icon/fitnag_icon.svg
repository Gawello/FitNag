<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#0F3460"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C55"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5"/>
      <stop offset="100%" style="stop-color:#B0B0B0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="92" ry="92" fill="none" stroke="#FF6B35" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Dumbbell - main icon element -->
  <!-- Left weight plate (outer) -->
  <rect x="88" y="196" width="52" height="120" rx="14" fill="url(#orangeGrad)"/>
  <!-- Left weight plate (inner) -->
  <rect x="120" y="210" width="40" height="92" rx="10" fill="url(#orangeGrad)"/>

  <!-- Bar -->
  <rect x="140" y="238" width="232" height="36" rx="18" fill="url(#barGrad)"/>

  <!-- Right weight plate (inner) -->
  <rect x="352" y="210" width="40" height="92" rx="10" fill="url(#orangeGrad)"/>
  <!-- Right weight plate (outer) -->
  <rect x="372" y="196" width="52" height="120" rx="14" fill="url(#orangeGrad)"/>

  <!-- Notification bell / nag indicator - top right -->
  <circle cx="400" cy="128" r="56" fill="url(#orangeGrad)"/>
  <circle cx="400" cy="128" r="48" fill="url(#bgGrad)"/>

  <!-- Exclamation mark inside bell circle -->
  <rect x="394" y="104" width="12" height="30" rx="6" fill="url(#orangeGrad)"/>
  <circle cx="400" cy="146" r="7" fill="url(#orangeGrad)"/>

  <!-- Small notification dot -->
  <circle cx="440" cy="88" r="16" fill="#4CAF50"/>
  <circle cx="440" cy="88" r="10" fill="#66BB6A"/>

  <!-- Lightning bolt accent (energy/motivation) -->
  <polygon points="248,350 268,380 256,380 270,420 242,384 254,384 240,350" fill="url(#orangeGrad)" opacity="0.9"/>

  <!-- Subtle "FN" text at bottom -->
  <text x="256" y="468" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold"
        fill="#F5F5F5" text-anchor="middle" opacity="0.6" letter-spacing="6">FN</text>
</svg>
